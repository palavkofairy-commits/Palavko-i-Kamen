<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Палавко и Камен</title>
  <style>
    :root{--paper:#fff8eb;--ink:#36261b;--soft:#7b6654;--line:rgba(70,45,28,.16);--card:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
    header{padding:34px 18px 22px;text-align:center;background:linear-gradient(180deg,#fff2d5 0%,#fff8eb 100%);border-bottom:1px solid var(--line)}
    h1{margin:0 0 8px;font-size:clamp(40px,8vw,76px);line-height:1;color:#5b351f;letter-spacing:0}
    .intro{margin:0 auto;max-width:760px;color:var(--soft);font-size:18px;line-height:1.5}
    main{width:min(940px,100%);margin:0 auto;padding:22px 14px 48px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .card{display:block;position:relative;overflow:hidden;min-height:260px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;text-decoration:none;box-shadow:0 8px 24px rgba(60,38,20,.08)}
    .card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f2e4cc}
    .card strong{display:block;padding:12px 14px 16px;font-size:18px;line-height:1.25}
    .num{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:6px;background:rgba(255,248,235,.92);color:#5b351f;font-weight:700;font-size:13px}
    footer{padding:0 18px 28px;text-align:center;color:var(--soft);font-size:14px}
    @media(max-width:540px){header{padding-top:26px}.grid{grid-template-columns:1fr}.card{min-height:0}}
  </style>
</head>
<body>
  <header>
    <h1>Палавко и Камен</h1>
    <p class="intro">Три приказки за приятелство, споделяне и как инатът понякога може да се стопи.</p>
  </header>
  <main><div class="grid">
    <a class="card" href="./palavko-i-kamen-sa-priyateli-kamen-s-ochila/">
      <img src="palavko-i-kamen-sa-priyateli-kamen-s-ochila/assets/kamen-reference.png" alt="Палавко и Камен са приятели">
      <span class="num">01</span>
      <strong>Палавко и Камен са приятели</strong>
    </a>
    <a class="card" href="./kamen-i-palavko-se-uchat-da-spodelyat/">
      <img src="kamen-i-palavko-se-uchat-da-spodelyat/assets/scene-01-kamen-arrives.png" alt="Камен и Палавко се учат да споделят">
      <span class="num">02</span>
      <strong>Камен и Палавко се учат да споделят</strong>
    </a>
    <a class="card" href="./kamen-i-palavko-i-denyat-bez-inat/">
      <img src="kamen-i-palavko-i-denyat-bez-inat/assets/scene-01-kamen-arrives-with-helicopter.png" alt="Камен и Палавко и денят без инат">
      <span class="num">03</span>
      <strong>Камен и Палавко и денят без инат</strong>
    </a>
  </div></main>
  <footer>© Палавко</footer>
</body>
</html>
